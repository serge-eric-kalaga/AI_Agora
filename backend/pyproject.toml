[project]
name = "ai-agora-backend"
version = "0.1.0"
description = "API et moteur d'orchestration de la plateforme AI Agora"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Equipe AI Agora" }]
dependencies = [
    "alembic>=1.14,<2",
    "bcrypt>=4.2,<6",
    "celery[redis]>=5.4,<6",
    "cryptography>=44,<46",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "prometheus-fastapi-instrumentator>=7,<8",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<2.12",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "pyjwt>=2.10,<3",
    "redis>=5.2,<6",
    "sqlalchemy>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501", "UP017", "UP042"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
