[project]
name = "backend-template"
version = "1.0.0"
description = "backend_template"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi[standard]>=0.115.8,<0.116",
    "uvicorn>=0.23.2,<0.24",
    "werkzeug>=3.1.3,<4",
    "pytest>=7.4.0,<8",
    "redis>=4.6.0,<5",
    "pymysql>=1.1.0,<2",
    "python-jose>=3.3.0,<4",
    "pycryptodome>=3.18.0,<4",
    "requests>=2.31.0,<3",
    "python-multipart==0.0.19",
    "sqlalchemy-utils>=0.41.1,<0.42",
    "cryptography>=44.0.1,<45",
    "pydantic-settings>=2.0.3,<3",
    "sqlalchemy>=2.0.20,<3",
    "httpx>=0.25.0,<0.26",
    "prometheus-fastapi-instrumentator>=6.1.0,<7",
    "python-json-logger>=2.0.7,<3",
    "python-socketio==5.10.0",
    "greenlet>=2.0.1",
    "faker>=36.1.1,<37",
    "pydantic>=2.10.6,<3",
    "certifi>=2025.1.31,<2026",
    "bcrypt>=4.2.1,<5",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-name = "api"
module-root = "."
